services:
  rabbitmq:
    image: rabbitmq:latest
    container_name: shop-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
  publisher:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: publisher
    env_file:
      - .env

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: worker
    env_file:
      - .env
